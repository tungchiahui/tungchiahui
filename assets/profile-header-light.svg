<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Tung Chia-hui — Robotics, ROS 2, SLAM, Embedded Linux and STM32 — light theme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="blueCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#1a7f64"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#1a7f64" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#0969da" stop-opacity=".22"/>
      <stop offset="65%" stop-color="#0969da" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#57606a" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="blur24" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- soft ambient light -->
  <circle cx="1055" cy="150" r="170" fill="url(#halo)"/>
  <circle cx="1120" cy="280" r="90" fill="#1a7f64" opacity=".08" filter="url(#blur24)"/>

  <!-- left identity block -->
  <g>
    <rect x="66" y="48" width="104" height="4" rx="2" fill="url(#blueCyan)"/>
    <text x="66" y="82" fill="#0969da" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">ROBOTICS SYSTEMS ENGINEER</text>

    <text x="64" y="140" fill="#24292f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="52" font-weight="760" letter-spacing=".2">Tung Chia-hui</text>
    <text x="66" y="173" fill="#57606a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="500">@tungchiahui · DawnChey</text>

    <text x="66" y="211" fill="#24292f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="500">From firmware and communication to perception, localization and navigation.</text>

    <!-- technology pills -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="600">
      <g transform="translate(66 238)">
        <rect width="72" height="32" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
        <circle cx="17" cy="16" r="4" fill="#0969da"/>
        <text x="29" y="21" fill="#24292f">ROS 2</text>
      </g>
      <g transform="translate(148 238)">
        <rect width="74" height="32" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
        <circle cx="17" cy="16" r="4" fill="#1a7f64"/>
        <text x="29" y="21" fill="#24292f">SLAM</text>
      </g>
      <g transform="translate(232 238)">
        <rect width="136" height="32" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
        <circle cx="17" cy="16" r="4" fill="#0969da"/>
        <text x="29" y="21" fill="#24292f">Embedded Linux</text>
      </g>
      <g transform="translate(378 238)">
        <rect width="82" height="32" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
        <circle cx="17" cy="16" r="4" fill="#1a7f64"/>
        <text x="29" y="21" fill="#24292f">STM32</text>
      </g>
    </g>
  </g>

  <!-- separator / data line -->
  <path d="M594 48V272" stroke="#d0d7de" stroke-width="1"/>
  <path d="M594 101V191" stroke="url(#blueCyan)" stroke-width="2" opacity=".65"/>

  <!-- right navigation / robot illustration -->
  <g transform="translate(632 22)">
    <!-- map contour -->
    <path d="M34 66 C98 18 185 30 235 58 S349 111 462 57" fill="none" stroke="#0969da" stroke-opacity=".18" stroke-width="1.4" stroke-dasharray="5 8"/>
    <path d="M21 235 C98 181 153 202 222 234 S353 266 500 202" fill="none" stroke="#1a7f64" stroke-opacity=".14" stroke-width="1.4" stroke-dasharray="4 8"/>

    <!-- route -->
    <path d="M58 232 C105 201 122 151 176 143 C236 134 243 205 305 194 C360 184 354 108 430 89" fill="none" stroke="url(#blueCyan)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="58" cy="232" r="7" fill="#ffffff" stroke="#0969da" stroke-width="3"/>
    <circle cx="176" cy="143" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <circle cx="305" cy="194" r="5" fill="#ffffff" stroke="#1a7f64" stroke-width="2"/>
    <circle cx="430" cy="89" r="8" fill="#1a7f64"/>
    <circle cx="430" cy="89" r="15" fill="none" stroke="#1a7f64" stroke-opacity=".28" stroke-width="2"/>

    <!-- lidar scan -->
    <g transform="translate(284 118)" fill="none">
      <circle r="96" stroke="#0969da" stroke-opacity=".10"/>
      <circle r="72" stroke="#0969da" stroke-opacity=".12"/>
      <circle r="48" stroke="#0969da" stroke-opacity=".16"/>
      <path d="M0 0 L-82 -50 M0 0 L-31 -91 M0 0 L68 -68 M0 0 L92 -16 M0 0 L75 58 M0 0 L-13 95 M0 0 L-88 39" stroke="#0969da" stroke-opacity=".18"/>
    </g>

    <!-- robot body -->
    <g transform="translate(244 92)">
      <rect x="0" y="28" width="82" height="58" rx="13" fill="#f6f8fa" stroke="#0969da" stroke-opacity=".8" stroke-width="2"/>
      <rect x="17" y="14" width="48" height="18" rx="8" fill="#eef6ff" stroke="#1a7f64" stroke-opacity=".85"/>
      <rect x="33" y="4" width="16" height="13" rx="5" fill="#1a7f64"/>
      <path d="M41 3V-12" stroke="#1a7f64" stroke-width="2"/>
      <circle cx="41" cy="-15" r="4" fill="#0969da"/>

      <!-- mecanum wheels -->
      <g fill="#24292f" stroke="#57606a" stroke-width="1.5">
        <rect x="-9" y="35" width="14" height="31" rx="6" transform="rotate(-12 -2 50)"/>
        <rect x="77" y="35" width="14" height="31" rx="6" transform="rotate(12 84 50)"/>
        <rect x="-7" y="64" width="14" height="28" rx="6" transform="rotate(12 0 78)"/>
        <rect x="75" y="64" width="14" height="28" rx="6" transform="rotate(-12 82 78)"/>
      </g>

      <!-- chassis center -->
      <circle cx="41" cy="57" r="10" fill="#ffffff" stroke="#d0d7de"/>
      <path d="M36 57H46M41 52V62" stroke="#0969da" stroke-width="1.5"/>
    </g>

    <!-- coordinate frame -->
    <g transform="translate(468 236)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700">
      <circle r="3" fill="#24292f"/>
      <path d="M0 0H31" stroke="#f85149" stroke-width="2"/>
      <path d="M0 0V-31" stroke="#1a7f64" stroke-width="2"/>
      <path d="M31 0l-6-4v8z" fill="#f85149"/>
      <path d="M0-31l-4 6h8z" fill="#1a7f64"/>
      <text x="36" y="4" fill="#f85149">X</text>
      <text x="-4" y="-37" fill="#1a7f64">Y</text>
    </g>

    <!-- small labels -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600">
      <g transform="translate(51 52)">
        <rect width="104" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/>
        <text x="13" y="17" fill="#57606a">map → odom → base</text>
      </g>
      <g transform="translate(366 142)">
        <rect width="100" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/>
        <text x="14" y="17" fill="#57606a">LiDAR · Nav2</text>
      </g>
    </g>
  </g>

  <!-- bottom accent -->
  <rect x="64" y="292" width="1072" height="1" fill="url(#softBlue)"/>
</svg>