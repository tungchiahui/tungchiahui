name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - "assets/profile-header-light.svg"
      - "assets/profile-header-dark.svg"
      - "scripts/update_profile_cards.py"
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USERNAME: tungchiahui
        run: python scripts/update_profile_cards.py

      - name: Commit updated cards
        run: |
          if git diff --quiet -- assets/*.svg README.md; then
            echo "Profile cards and README cache keys are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          git commit -m "chore: refresh profile cards"
          git push
